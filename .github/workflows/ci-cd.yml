name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run tests (if you add tests later)
      run: |
        echo "Add your tests here"
        # python -m pytest tests/
    
    - name: Build Docker image
      run: |
        docker build -t fastapi-docker-demo:${{ github.sha }} .
        docker build -t fastapi-docker-demo:latest .
    
    - name: Test Docker image
      run: |
        docker run -d -p 8000:8000 --name test-container fastapi-docker-demo:latest
        sleep 5
        curl -f http://localhost:8000/health || exit 1
        docker stop test-container
        docker rm test-container
    
