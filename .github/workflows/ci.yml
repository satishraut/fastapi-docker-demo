name: FastAPI CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run basic app check
      run: python -c "from main import app; print('App loaded successfully')"

    - name: Debug secrets presence
      run: |
        if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then echo "Username missing"; else echo "Username OK"; fi
        if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then echo "Token missing"; else echo "Token OK"; fi

    - name: Login to DockerHub
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-demo:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-demo:latest
