name: FastAPI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Debug secrets (safe)
      run: |
        if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then echo "Username missing"; else echo "Username OK"; fi
        if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then echo "Password missing"; else echo "Password OK"; fi

    - name: Login to DockerHub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/fastapi-demo:latest .

    - name: Push image to DockerHub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-demo:latest